<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- 外部への通信をすべて禁止する（データがスマホの外に出ないことを、ブラウザに守らせる） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>完済ナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="lock" class="lock" hidden></div>

  <div id="app" hidden>
    <header class="topbar">
      <h1 id="page-title" class="topbar-title">完済ナビ</h1>
      <button type="button" class="icon-btn" data-action="open-settings" aria-label="設定"><span data-icon="settings"></span></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="画面の切り替え">
      <button type="button" data-tab="home"><span data-icon="home"></span><span>ホーム</span></button>
      <button type="button" data-tab="plan"><span data-icon="bulb"></span><span>提案</span></button>
      <button type="button" data-tab="forecast"><span data-icon="chart"></span><span>予測</span></button>
      <button type="button" data-tab="records"><span data-icon="list"></span><span>記録</span></button>
      <button type="button" data-tab="budget"><span data-icon="wallet"></span><span>家計</span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="modal" class="modal"></dialog>
  <dialog id="pinpad" class="pinpad-dialog"></dialog>
  <div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" hidden>

  <noscript><p class="noscript">このアプリを使うには、JavaScript を有効にしてください。</p></noscript>
</body>
</html>
